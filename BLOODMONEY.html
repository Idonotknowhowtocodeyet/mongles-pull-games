<style>
  /* Removes default browser spacing around the edges of the page */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;       /* Prevents accidental scrolling */
    background-color: #000; /* Black background matches the game theme */
  }

  .fullscreen-container {
    width: 100vw;           /* 100% of viewport width */
    height: 100vh;          /* 100% of viewport height */
    position: fixed;
    top: 0;
    left: 0;
  }

  .fullscreen-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>

<div class="fullscreen-container">
  <iframe 
    src="https://github.io" 
    title="BLOODMONEY Fullscreen"
    allow="autoplay; fullscreen; gamepad">
  </iframe>
</div>
